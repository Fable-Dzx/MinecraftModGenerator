name: Build & Auto Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BASE_VERSION: "0.1"
  ARTIFACT_NAME: "minecraft-mod-generator-src"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set full version
        id: set_version
        run: |
          echo "FULL_VERSION=${{ env.BASE_VERSION }}.${{ github.run_number }}" >> $GITHUB_ENV
          echo "FULL_VERSION=${{ env.BASE_VERSION }}.${{ github.run_number }}"

      - name: Set version in gradle.properties
        run: |
          echo "projectVersion=${{ env.FULL_VERSION }}" >> gradle.properties
          cat gradle.properties

      - name: Gradle build + test
        run: ./gradlew clean test jar -Pversion=${{ env.FULL_VERSION }}

      - name: Package source zip
        run: |
          zip -r ${{ env.ARTIFACT_NAME }}-${{ env.FULL_VERSION }}.zip . \
            -x "build/*" ".gradle/*" ".github/workflows/build/*" ".git/*" "*.zip"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ env.FULL_VERSION }}
          path: |
            generator-core/build/libs/*.jar
            ${{ env.ARTIFACT_NAME }}-${{ env.FULL_VERSION }}.zip

      - name: Skip release on PR
        if: github.event_name == 'pull_request'
        run: echo "Pull request, skip release"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.FULL_VERSION }}
          name: Release ${{ env.FULL_VERSION }}
          body: |
            Auto build release `${{ env.FULL_VERSION }}`
            Build run number: ${{ github.run_number }}
            Commit SHA: ${{ github.sha }}
            - generator-core jar
            - full source zip
          files: |
            generator-core/build/libs/*.jar
            ${{ env.ARTIFACT_NAME }}-${{ env.FULL_VERSION }}.zip
          generate_release_notes: true
