plugins {
    id 'java-library'
}

group = 'com.example.modgen'
version = '0.1.0-SNAPSHOT'
description = 'Pure Java documentation parsing layer - no web dependencies'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Markdown parsing (CommonMark)
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'

    // Java source parsing (QDox)
    implementation 'com.thoughtworks.qdox:qdox:2.0.3'

    // Legacy HTML documentation parsing
    implementation 'org.jsoup:jsoup:1.17.2'

    // JSON parsing for GitHub API responses
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
